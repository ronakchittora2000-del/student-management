<html>
<head>
  <title>Student Management</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <div class="top-buttons">

    <button onclick="showStudent()">Students</button>
  </div>

  <!-- LOGIN SECTION -->

  <div id="loginSection">

```
<h2>Welcome Back</h2>

<input type="text" id="signupName" placeholder="Full Name">

<input type="password" id="signupPassword" placeholder="Password">

<button class="main-btn" onclick="signup()">Signup</button>

<hr>

<input type="email" id="loginEmail" placeholder="Login Email">
<input type="password" id="loginPassword" placeholder="Login Password">

<button class="main-btn" onclick="login()">Login</button>
```

  </div>

  <!-- STUDENT SECTION -->

  <div id="studentSection" style="display:none;">

```
<h2>Student Management</h2>

<input type="text" id="name" placeholder="Student Name">
<input type="text" id="course" placeholder="Course Name">

<button class="main-btn" onclick="addStudent()">Add Student</button>
<button class="update-btn" onclick="updateStudent()">Update</button>

<ul id="list"></ul>
```

  </div>

</div>
